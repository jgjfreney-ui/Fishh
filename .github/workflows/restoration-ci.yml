name: Restoration + Recast Audit

on:
  push:
    branches:
      - remaster/restoration-pass
      - remaster/phase-two
      - remaster/recast
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check game JavaScript
        run: |
          node --check js/data.js
          node --check js/sprites.js
          node --check js/audio.js
          node --check js/game.js
          node --check js/remaster-scenes.js
          node --check js/remaster.js
          node --check js/remaster-ui.js
          node --check js/remaster-audio.js
          node --check js/remaster-foreground.js
          node --check js/remaster-trap.js
          if [ -f js/recast-sprites.js ]; then node --check js/recast-sprites.js; fi
          if [ -f js/recast-collectibles.js ]; then node --check js/recast-collectibles.js; fi
          if [ -f js/recast-audio.js ]; then node --check js/recast-audio.js; fi
          if [ -f js/recast-shiny.js ]; then node --check js/recast-shiny.js; fi
          if [ -f js/recast-lounge.js ]; then node --check js/recast-lounge.js; fi

      - name: Validate content and progression
        run: node scripts/restoration-audit.js

      - name: Verify progression reachability
        run: node scripts/progression-reachability-v2.js

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save jsdom@24

      - name: Headless gameplay and aquarium smoke test
        run: node scripts/runtime-smoke.js

      - name: Headless Recast presentation and art smoke test
        if: hashFiles('js/recast-sprites.js') != ''
        run: node scripts/remaster-smoke.js

      - name: Verify Recast Phase Three features
        if: hashFiles('scripts/recast-phase-three-smoke.js') != ''
        run: node scripts/recast-phase-three-smoke.js

      - name: Verify web package can be assembled
        run: |
          npm run build:web
          test -f www/index.html
          test -f www/js/game.js
          test -f www/js/remaster-scenes.js
          test -f www/js/remaster.js
          test -f www/js/remaster-ui.js
          test -f www/js/remaster-audio.js
          test -f www/js/remaster-foreground.js
          test -f www/js/remaster-trap.js
          test -f www/css/remaster.css
          if [ -f js/recast-sprites.js ]; then test -f www/js/recast-sprites.js; fi
          if [ -f js/recast-collectibles.js ]; then test -f www/js/recast-collectibles.js; fi
          if [ -f js/recast-audio.js ]; then test -f www/js/recast-audio.js; fi
          if [ -f js/recast-shiny.js ]; then test -f www/js/recast-shiny.js; fi
          if [ -f js/recast-lounge.js ]; then test -f www/js/recast-lounge.js; fi
          if [ -f css/recast-lounge.css ]; then test -f www/css/recast-lounge.css; fi
