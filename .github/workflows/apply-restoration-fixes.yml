name: Apply Recast Core Patches

on:
  push:
    branches:
      - remaster/recast
    paths:
      - "scripts/apply-recast-shiny-core.js"
      - ".github/workflows/apply-restoration-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Recast branch
        uses: actions/checkout@v4
        with:
          ref: remaster/recast

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply Recast shiny consistency patch
        run: node scripts/apply-recast-shiny-core.js

      - name: Syntax-check patched engine
        run: node --check js/game.js

      - name: Commit Recast engine changes
        run: |
          if git diff --quiet -- js/game.js; then
            echo "No Recast core changes to commit."
            exit 0
          fi
          git config user.name "Deep Sea Recast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/game.js
          git commit -m "Make shiny presentation palette-driven across core renders"
          git push origin HEAD:remaster/recast
