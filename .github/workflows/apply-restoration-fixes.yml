name: Apply Restoration Fixes

on:
  push:
    branches:
      - remaster/restoration-pass
    paths:
      - "scripts/apply-restoration-fixes.js"
      - ".github/workflows/apply-restoration-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout restoration branch
        uses: actions/checkout@v4
        with:
          ref: remaster/restoration-pass

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply deterministic restoration patch
        run: node scripts/apply-restoration-fixes.js

      - name: Syntax-check patched engine
        run: node --check js/game.js

      - name: Commit restoration engine changes
        run: |
          if git diff --quiet -- js/game.js; then
            echo "No engine changes to commit."
            exit 0
          fi
          git config user.name "Deep Sea Restoration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/game.js
          git commit -m "Restore progression, saves, darkness and aquarium input"
          git push origin HEAD:remaster/restoration-pass
