name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - remaster/phase-two
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"

concurrency:
  group: deep-sea-diver-phase-two-android
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase Two remaster branch
        uses: actions/checkout@v4
        with:
          ref: remaster/phase-two

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Run restoration and remaster checks
        run: |
          node --check js/data.js
          node --check js/sprites.js
          node --check js/audio.js
          node --check js/game.js
          node --check js/remaster-scenes.js
          node --check js/remaster.js
          node --check js/remaster-ui.js
          node --check js/remaster-audio.js
          node --check js/remaster-foreground.js
          node --check js/remaster-trap.js
          node scripts/restoration-audit.js
          node scripts/progression-reachability-v2.js
          npm install --no-save jsdom@24
          node scripts/runtime-smoke.js
          node scripts/remaster-smoke.js

      - name: Copy web assets into www
        run: npm run build:web

      - name: Add Android platform
        run: npx --no-install cap add android

      - name: Sync Capacitor
        run: npx --no-install cap sync android

      - name: Set remaster version
        run: |
          cd android/app
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"2.0-phase2.${{ github.run_number }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Use stable debug signing key
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk deep-sea-diver-remastered-phase-two.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-sea-diver-remastered-phase-two-apk
          path: deep-sea-diver-remastered-phase-two.apk
          if-no-files-found: error