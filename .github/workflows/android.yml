name: Build Android APK

# Builds an installable debug APK for Deep Sea Diver.
# Run it from the GitHub "Actions" tab (Run workflow), or it runs automatically
# when the game changes. Download the APK from the run's "Artifacts" section.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/deep-sea-fishing-game-ihlwg7
      - main
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install dependencies
        run: npm install

      - name: Copy web assets into www/
        run: npm run build:web

      - name: Add Android platform
        run: npx --no-install cap add android

      - name: Sync Capacitor
        run: npx --no-install cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk deep-sea-diver.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-sea-diver-apk
          path: deep-sea-diver.apk
          if-no-files-found: error
