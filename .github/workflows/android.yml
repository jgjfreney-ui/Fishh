name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - remaster/recast
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - "manifest.webmanifest"
      - "android-signing/**"
      - ".github/workflows/android.yml"

concurrency:
  group: deep-sea-diver-recast-android
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Recast branch
        uses: actions/checkout@v4
        with:
          ref: remaster/recast

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Run restoration and Recast checks
        run: |
          node --check js/data.js
          node --check js/sprites.js
          node --check js/audio.js
          node --check js/game.js
          node --check js/remaster-scenes.js
          node --check js/remaster.js
          node --check js/remaster-ui.js
          node --check js/remaster-audio.js
          node --check js/remaster-foreground.js
          node --check js/remaster-trap.js
          node --check js/recast-sprites.js
          node --check js/recast-collectibles.js
          node --check js/recast-audio.js
          node --check js/recast-shiny.js
          node --check js/recast-lounge.js
          node --check js/recast-gameplay.js
          node --check scripts/recast-visual-sanity.js
          node --check scripts/recast-gameplay-smoke.js
          node scripts/restoration-audit.js
          node scripts/progression-reachability-v2.js
          npm install --no-save jsdom@24
          node scripts/runtime-smoke.js
          node scripts/remaster-smoke.js
          node scripts/recast-phase-three-smoke.js
          node scripts/recast-visual-sanity.js
          node scripts/recast-gameplay-smoke.js

      - name: Copy web assets into www
        run: npm run build:web

      - name: Verify Recast web assets and mobile profile
        run: |
          test -f www/js/recast-audio.js
          test -f www/js/recast-shiny.js
          test -f www/js/recast-lounge.js
          test -f www/js/recast-gameplay.js
          test -f www/css/recast-lounge.css
          node --check www/js/game.js
          node --check www/js/remaster.js
          node --check www/js/remaster-scenes.js
          node --check www/js/remaster-trap.js
          node --check www/js/remaster-foreground.js
          node --check www/js/audio.js
          node --check www/js/recast-audio.js
          grep -q "RECAST_MOBILE_PERFORMANCE" www/js/game.js
          grep -q "RECAST_MOBILE_LIGHTWEIGHT" www/js/remaster.js
          grep -q "RECAST_MOBILE_LIGHTWEIGHT" www/js/remaster-scenes.js
          grep -q "RECAST_MOBILE_LIGHTWEIGHT" www/js/remaster-trap.js
          grep -q "RECAST_FOREGROUND_DISABLED" www/js/remaster-foreground.js
          grep -q "RECAST_CORE_DIVER" www/js/remaster-foreground.js
          grep -q "musicMuted ? 0 : 1.65" www/js/audio.js
          grep -q "CUSTOM_MUSIC_GAIN=.42" www/js/recast-audio.js
          grep -q "MUSIC_GAIN=0.055" www/js/remaster-audio.js
          node -e "const c=require('./capacitor.config.json'); if(c.appId!=='com.deepsea.diver') throw new Error('Unexpected Android appId: '+c.appId)"

      - name: Verify committed Recast signing key
        run: |
          keytool -list -v \
            -keystore android-signing/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android > /tmp/recast-key.txt
          SIGNING_SHA256=$(awk -F': ' '/SHA256:/{print $2; exit}' /tmp/recast-key.txt | tr -d '\r')
          test -n "$SIGNING_SHA256"
          echo "Stable Recast signer SHA256: $SIGNING_SHA256"
          echo "RECAST_SIGNING_SHA256=$SIGNING_SHA256" >> "$GITHUB_ENV"

      - name: Add Android platform
        run: npx --no-install cap add android

      - name: Sync Capacitor
        run: npx --no-install cap sync android

      - name: Force stable debug signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'stableRecast' not in s:
              signing = '''android {\n    signingConfigs {\n        stableRecast {\n            storeFile file("../../android-signing/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }'''
              if 'android {' not in s:
                  raise SystemExit('android block not found in generated build.gradle')
              s = s.replace('android {', signing, 1)
              if 'buildTypes {' not in s:
                  raise SystemExit('buildTypes block not found in generated build.gradle')
              s = s.replace('buildTypes {', 'buildTypes {\n        debug {\n            signingConfig signingConfigs.stableRecast\n        }', 1)
          p.write_text(s)
          if 'signingConfig signingConfigs.stableRecast' not in s:
              raise SystemExit('stable Recast debug signing was not installed')
          PY
          grep -n -A8 -B2 "stableRecast" android/app/build.gradle

      - name: Set Recast version
        run: |
          DAY_CODE=$(date -u +%y%m%d)
          VERSION_CODE=$((DAY_CODE * 1000 + GITHUB_RUN_NUMBER % 1000))
          cd android/app
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"3.4-recast.${{ github.run_number }}\"/" build.gradle
          echo "Recast versionCode=$VERSION_CODE"
          grep -E "versionCode|versionName|applicationId" build.gradle

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK signer is stable
        run: |
          ACTUAL_SHA256=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '\r')
          echo "Built APK signer SHA256: $ACTUAL_SHA256"
          test -n "$ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$RECAST_SIGNING_SHA256"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk deep-sea-diver-recast.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-sea-diver-recast-apk
          path: deep-sea-diver-recast.apk
          if-no-files-found: error
